<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>SVG-Export: Text als Pfade</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #18181a;
      --muted: #6b6b73;
      --accent: #0f9d8a;
      --border: #d4d4da;
      --error: #c0392b;
    }
    body.dark {
      --bg: #18181a;
      --fg: #f0f0f3;
      --muted: #a0a0aa;
      --accent: #7efff5;
      --border: #3a3a40;
      --error: #ff7b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font: 14px/1.4 system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .sel {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      color: var(--muted);
      max-height: 90px;
      overflow: auto;
    }
    .sel strong { color: var(--fg); }
    label {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 14px;
      cursor: pointer;
    }
    label input { margin-top: 3px; accent-color: var(--accent); }
    label small { display: block; color: var(--muted); }
    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #000;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { margin-top: 12px; color: var(--muted); min-height: 1.4em; }
    #status.error { color: var(--error); }
    #out { margin-top: 12px; }
    .file {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .file .name { font-weight: 600; word-break: break-all; }
    .file .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .file button {
      padding: 6px 8px;
      font-size: 12px;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .file button.primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>SVG exportieren <small style="font-weight:400;color:var(--muted)">v6</small></h1>

  <div class="sel" id="sel">Keine Auswahl</div>

  <div id="status"></div>
  <div id="out"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const applyTheme = (t) => document.body.classList.toggle("dark", t === "dark");
    applyTheme(params.get("theme"));

    const $ = (id) => document.getElementById(id);
    const selEl = $("sel");
    const statusEl = $("status");

    function setStatus(text, level) {
      statusEl.textContent = text || "";
      statusEl.className = level === "error" ? "error" : "";
    }

    function safeFileName(name) {
      const cleaned = String(name || "export")
        .replace(/[\\/:*?"<>|]+/g, "_")
        .trim();
      return (cleaned || "export") + ".svg";
    }

    function toBytes(file) {
      return Uint8Array.from(file.data, (c) => c.charCodeAt(0));
    }

    // Ausweichwege, falls der Browser Downloads aus dem Plugin-Fenster blockiert.
    function openInTab(file) {
      const blob = new Blob([toBytes(file)], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const win = window.open(url, "_blank");
      if (!win) setStatus("Der Browser hat das neue Fenster blockiert. Bitte Pop-ups erlauben.", "error");
    }

    // Öffnet einen normalen Tab, der den Download selbst auslöst. Normale Tabs sind
    // nicht so eingeschränkt wie das Plugin-Fenster.
    function saveViaTab(file) {
      // Der SVG-Text steckt direkt in der neuen Seite; den Blob erzeugt sie selbst.
      // (Eine Blob-URL aus dem Plugin-Fenster ist im neuen Tab nicht abrufbar.)
      const svgText = new TextDecoder().decode(toBytes(file));
      const name = safeFileName(file.name);
      const js =
        "const svg=" + JSON.stringify(svgText).replace(/</g, "\\u003c") + ";" +
        "const a=document.getElementById('a');" +
        "a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));" +
        "a.download=" + JSON.stringify(name) + ";a.click();";
      const page =
        '<!doctype html><meta charset="utf-8"><title>Download</title>' +
        '<body style="font:14px system-ui;padding:24px"><p>Download startet …</p>' +
        '<a id="a">Falls nichts passiert: hier klicken</a>' +
        "<script>" + js + "<\/script>";
      const pageUrl = URL.createObjectURL(new Blob([page], { type: "text/html" }));
      const win = window.open(pageUrl, "_blank");
      if (!win) setStatus("Der Browser hat das neue Fenster blockiert. Bitte Pop-ups erlauben.", "error");
    }

    function copyCode(file) {
      const text = new TextDecoder().decode(toBytes(file));
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      setStatus(ok ? "SVG-Code kopiert. In einem Editor einfügen und als .svg speichern." : "Kopieren nicht möglich.", ok ? "info" : "error");
    }

    function renderFiles(files) {
      const out = $("out");
      out.innerHTML = "";
      files.forEach((file) => {
        const box = document.createElement("div");
        box.className = "file";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = safeFileName(file.name) + " (" + Math.round(file.data.length / 1024) + " KB)";
        const row = document.createElement("div");
        row.className = "row";
        const b0 = document.createElement("button");
        b0.textContent = "Als Datei speichern";
        b0.className = "primary";
        b0.addEventListener("click", () => saveViaTab(file));
        const b2 = document.createElement("button");
        b2.textContent = "In neuem Tab öffnen";
        b2.addEventListener("click", () => openInTab(file));
        const b3 = document.createElement("button");
        b3.textContent = "Code kopieren";
        b3.addEventListener("click", () => copyCode(file));
        row.append(b0, b2, b3);
        box.append(name, row);
        out.appendChild(box);
      });
    }

    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== "object") return;

      if (msg.type === "theme") {
        applyTheme(msg.theme);
      } else if (msg.type === "selection") {
        const items = msg.items || [];
        if (items.length === 0) {
          selEl.textContent = "Keine Auswahl";
          $("out").innerHTML = "";
          setStatus("Bitte ein Board oder eine Ebene auswählen.");
        } else {
          selEl.innerHTML = "";
          const head = document.createElement("strong");
          head.textContent = items.length === 1 ? "1 Ebene ausgewählt" : items.length + " Ebenen ausgewählt";
          selEl.appendChild(head);
          items.slice(0, 5).forEach((it) => {
            const row = document.createElement("div");
            row.textContent = it.name;
            selEl.appendChild(row);
          });
          if (items.length > 5) {
            const more = document.createElement("div");
            more.textContent = "… und " + (items.length - 5) + " weitere";
            selEl.appendChild(more);
          }
        }
      } else if (msg.type === "clear") {
        $("out").innerHTML = "";
      } else if (msg.type === "preparing") {
        $("out").innerHTML = "";
        setStatus("Bereite Export vor …");
      } else if (msg.type === "status") {
        setStatus(msg.text, msg.level);
      } else if (msg.type === "result") {
        try {
          renderFiles(msg.files);
        } catch (e) {
          setStatus("Fehler: " + (e && e.message ? e.message : e), "error");
          return;
        }
        const n = msg.files.length;
        let text = n === 1 ? "SVG bereit." : n + " SVG-Dateien bereit.";
        text += " " + msg.flattened + " Texte in Pfade umgewandelt.";
        if (msg.remaining > 0) {
          text += " Achtung: " + msg.remaining + " Texte konnten nicht umgewandelt werden.";
        }
        setStatus(text, msg.remaining > 0 ? "error" : "info");
      }
    });

    parent.postMessage({ type: "ready" }, "*");
  </script>
</body>
</html>
